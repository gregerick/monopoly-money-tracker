<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Money Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <div class="free-parking-display">
                <span class="free-parking-icon">🅿️</span>
                <span>Free Parking: $<span id="freeParkingBalance">0</span></span>
            </div>
        </div>
        <h1>Monopoly Money Tracker</h1>
        <div class="header-right">
            <div class="controls">
                <button id="resetBtn" class="btn btn-danger">Reset Game</button>
                <button id="saveBtn" class="btn btn-primary">Save Game</button>
                <input type="file" id="loadFile" accept=".json" style="display: none;">
                <button id="loadBtn" class="btn btn-secondary">Load Game</button>
            </div>
            <div class="action-buttons">
                <button id="editPlayersBtn" class="btn btn-icon" title="Edit Players">✏️</button>
                <button id="historyBtn" class="btn btn-icon" title="History">🕐</button>
                <button id="undoBtn" class="btn btn-icon" title="Undo">↩️</button>
            </div>
        </div>
    </header>

    <main>
        <section class="players-grid">
            <div class="player-card" data-player-id="1">
                <div class="player-avatar">
                    <img src="https://picsum.photos/seed/player1/100/100.jpg" alt="Player 1">
                </div>
                <div class="player-info">
                    <h3 class="player-name">Player 1</h3>
                    <div class="player-balance">$<span class="balance-amount">1500</span></div>
                </div>
            </div>

            <div class="player-card" data-player-id="2">
                <div class="player-avatar">
                    <img src="https://picsum.photos/seed/player2/100/100.jpg" alt="Player 2">
                </div>
                <div class="player-info">
                    <h3 class="player-name">Player 2</h3>
                    <div class="player-balance">$<span class="balance-amount">1500</span></div>
                </div>
            </div>

            <div class="player-card" data-player-id="3">
                <div class="player-avatar">
                    <img src="https://picsum.photos/seed/player3/100/100.jpg" alt="Player 3">
                </div>
                <div class="player-info">
                    <h3 class="player-name">Player 3</h3>
                    <div class="player-balance">$<span class="balance-amount">1500</span></div>
                </div>
            </div>

            <div class="player-card" data-player-id="4">
                <div class="player-avatar">
                    <img src="https://picsum.photos/seed/player4/100/100.jpg" alt="Player 4">
                </div>
                <div class="player-info">
                    <h3 class="player-name">Player 4</h3>
                    <div class="player-balance">$<span class="balance-amount">1500</span></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Transfer Modal -->
    <div id="transferModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Transfer Money</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Transfer for <span id="selectedPlayerName"></span>:</p>
                
                <!-- Step 1: Transfer Type Selection -->
                <div id="transferTypeSection">
                    <div class="transfer-options">
                        <button id="paysBtn" class="btn btn-primary">Pays</button>
                        <button id="receivesBtn" class="btn btn-primary">Receives</button>
                    </div>
                </div>
                
                <!-- Step 2: Amount Input -->
                <div id="amountSection" style="display: none;">
                    <div class="amount-input-container">
                        <label for="transferAmount">Amount:</label>
                        <div class="amount-display">
                            <input type="number" id="transferAmount" min="0" step="1" value="0" readonly>
                        </div>
                        <div class="keypad">
                            <div class="keypad-row">
                                <button class="keypad-btn" data-value="1">1</button>
                                <button class="keypad-btn" data-value="2">2</button>
                                <button class="keypad-btn" data-value="3">3</button>
                            </div>
                            <div class="keypad-row">
                                <button class="keypad-btn" data-value="4">4</button>
                                <button class="keypad-btn" data-value="5">5</button>
                                <button class="keypad-btn" data-value="6">6</button>
                            </div>
                            <div class="keypad-row">
                                <button class="keypad-btn" data-value="7">7</button>
                                <button class="keypad-btn" data-value="8">8</button>
                                <button class="keypad-btn" data-value="9">9</button>
                            </div>
                            <div class="keypad-row">
                                <button class="keypad-btn" data-value="0">0</button>
                                <button class="keypad-btn" data-value="00">00</button>
                                <button class="keypad-btn clear-btn" data-action="clear">C</button>
                            </div>
                        </div>
                    </div>
                    <div class="amount-actions">
                        <button id="backBtn" class="btn btn-secondary" style="display: none;">Back</button>
                        <button id="passGoBtn" class="btn btn-warning" style="display: none;">Pass Go (+$200)</button>
                        <button id="confirmAmount" class="btn btn-success">Continue</button>
                    </div>
                </div>
                
                <!-- Step 3: Target Selection -->
                <div id="targetSection" style="display: none;">
                    <p id="targetPrompt">Select transfer target:</p>
                    <div class="target-players" id="targetPlayersContainer">
                        <!-- Target players will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Players Modal -->
    <div id="editPlayersModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Players</h2>
                <button class="close-btn" id="closeEditModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="edit-players-container" id="editPlayersContainer">
                    <!-- Player edit fields will be populated here -->
                </div>
                <div class="modal-actions">
                    <button id="savePlayerNames" class="btn btn-primary">Save Changes</button>
                    <button id="cancelEdit" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Transaction History</h2>
                <button class="close-btn" id="closeHistoryModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="history-container" id="historyContainer">
                    <!-- History items will be populated here -->
                </div>
                <div class="modal-actions">
                    <button id="clearHistory" class="btn btn-danger">Clear History</button>
                    <button id="closeHistory" class="btn btn-secondary">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
